<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="The Oregon Trail (1978) running in the browser as a Fortran-to-WebAssembly build, driven by a terminal-based game launcher."
    />
    <!--
      interactive-widget=resizes-content (Chrome desktop and Android, and
      Firefox by default) resizes the layout viewport itself for the soft
      keyboard instead of leaving a keyboard-hidden area below it. That
      hidden area is why a one-finger drag anywhere on the page could pan
      the whole page down off-screen -- and every element then resized
      toward the new transient viewport ("pull down, header moves and
      gray shows at the bottom, snap back on release"). With the area
      gone, a plain pull is a plain overscroll: glow, then
      pull-to-refresh. Safari ignores the tag; its keyboard rides outside
      the document, so launcher.js forecasts the keyboard inset at focus
      and animates the terminal's shrink in sync with the keyboard slide
      (terminal-keyboard.js), while a touchmove gate blocks the northward
      drag Safari's pan slack would otherwise allow.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0c0b" />
    <title>The Oregon Trail (1978)</title>
    <!--
      Retro pixel-art "Oregon Trail" covered wagon (a.k.a. the cart) in the
      site's neon terminal green (#c8f8c8) on the terminal background
      (#111512). SVG is served to browsers that support it (modern Chrome,
      Firefox and Safari); the multi-resolution favicon.ico and the
      size-tagged PNGs are fallbacks so every browser shows an icon
      regardless of SVG support.
    -->
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon-16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="./favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-64.png" sizes="64x64" />
    <link
      rel="apple-touch-icon"
      href="./apple-touch-icon.png"
      sizes="180x180"
    />
    <!--
      The launcher uses SharedArrayBuffer to stream keyboard input into a Web
      Worker that runs the WASM module, which requires cross-origin isolation.
      The coi-serviceworker.js (MIT, by Guido Zuidhof and contributors) registers
      a service worker that supplies the COOP/COEP response headers so this
      works from any static server (and file:// is not supported). It would
      prefer COEP: credentialless, but that mode is unsupported in some
      browsers (including older iOS Safari), where it costs an extra guarded
      degrade reload per session; every resource here is same-origin, so
      require-corp works everywhere and the reload hop is skipped outright.
    -->
    <script>
      window.coi = { coepCredentialless: () => false };
    </script>
    <script src="./coi-serviceworker.js"></script>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        background: #0b0c0b;
      }
      ::selection {
        background: rgba(200, 248, 200, 0.24);
        color: #c8f8c8;
      }
      ::-moz-selection {
        background: rgba(200, 248, 200, 0.24);
        color: #c8f8c8;
      }
      body {
        color: #c8f8c8;
        font-family: "Courier New", Courier, monospace;
        font-size: 16px;
        margin: 0;
        min-height: 100dvh;
        padding: 32px 16px;
        /* Kills the double-tap zoom: one less pulse on every tap, snappier
           ones (keyboard-lab blue24). Panning and pinch are untouched, so
           pull-to-refresh still works. */
        touch-action: manipulation;
      }
      main {
        margin: 0 auto;
        max-width: 800px;
      }
      #title {
        color: #c8f8c8;
        font-size: 14px;
        font-weight: normal;
        letter-spacing: 0.08em;
        margin: 0 0 4px;
        text-align: center;
        text-transform: uppercase;
      }
      #subtitle {
        color: rgba(200, 248, 200, 0.6);
        font-size: 12px;
        letter-spacing: 0.08em;
        margin: 0 0 12px;
        text-align: center;
        text-transform: uppercase;
      }
      .visually-hidden {
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }
      #status {
        color: #ffc47d;
        font-size: 13px;
        margin: 0 0 12px;
        min-height: 1em;
      }
      #terminal-container {
        background: #111512;
        border-radius: 12px;
        box-shadow:
          inset 0 0 30px rgba(255, 255, 255, 0.03),
          0 0 70px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.05);
        height: min(600px, calc(100vh - 200px));
        min-height: 360px;
        overflow: hidden;
        position: relative;
      }
      #terminal-container::before {
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 2px,
          rgba(255, 255, 255, 0.025) 3px
        );
        content: "";
        inset: 0;
        pointer-events: none;
        position: absolute;
        z-index: 2;
      }
      #screen {
        color: #c8f8c8;
        font: inherit;
        height: 100%;
        line-height: 1.2;
        /* Desktop: the transcript is a plain native scroller. Wheel and
           touch gestures scroll it natively, and a spent end chains to
           the outer page by itself -- the pre-9dea85f contract. The touch
           shell below overrides this with overflow hidden, where the
           JS-driven log (blue29/30, iOS rubber-band fixes) owns every
           write instead. */
        overflow-y: auto;
        padding: 28px;
        text-shadow: 0 0 2px rgba(200, 248, 200, 0.35);
      }
      /* Android only (launcher.js sets the attribute): native transcript
         there too, for the same reason as desktop -- the browser owns the
         gesture, chains a spent end to the page and runs pull-to-refresh
         at the top by itself, with no preventDefault race to lose. iOS
         keeps overflow hidden (blue29/30) and the driven log. */
      html[data-oregon-log="native"] #screen {
        overflow-y: auto;
      }
      #terminal {
        color: inherit;
        font: inherit;
        margin: 0;
        overflow-wrap: break-word;
        white-space: pre-wrap;
      }
      #terminal-input {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 1px;
        font-size: 16px;
        color: transparent;
        background: transparent;
        border: none;
        outline: none;
        caret-color: transparent;
        pointer-events: none;
        z-index: -1;
      }
      .terminal-actions {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
      }
      .terminal-actions a {
        -webkit-appearance: none;
        appearance: none;
        border: 1px solid rgba(200, 248, 200, 0.25);
        border-radius: 6px;
        color: rgba(200, 248, 200, 0.65);
        font-size: 14px;
        letter-spacing: 0.08em;
        outline: 0;
        text-decoration: none;
        text-transform: uppercase;
        transition:
          background-color 0.18s ease-out,
          border-color 0.18s ease-out,
          color 0.18s ease-out,
          text-shadow 0.18s ease-out;
      }
      /* The arrow stands ON the text's baseline, like any glyph: an inline
         replaced element's baseline is its bottom edge, so SOURCE and the
         icon share the one vertical anchor every platform agrees on, and
         the 8px box spans roughly the caps' 8px height -- center-to-center
         drift is impossible by construction. Box-center alignment (flex,
         vertical-align middle) instead anchors to the line box center,
         (ascent - descent) / 2 above the baseline where caps center at
         cap-height / 2: numbers that differ per platform for the same
         font family, which is what made the icon drift. */
      .terminal-actions a svg {
        fill: none;
        /* No literal whitespace between label and icon in the markup:
           in inline flow it would render as a full Courier space (~8px).
           A fixed margin reproduces the original gap exactly. */
        margin-left: 6px;
        shape-rendering: crispEdges;
        stroke: currentColor;
        stroke-linecap: butt;
        stroke-linejoin: miter;
        stroke-width: 1;
        vertical-align: baseline;
      }
      /* Both controls share this box: the label centered by line-height,
          no flex, because iOS Safari does not stretch a flex-item
          <button>. The FLOOR (not a fixed height) keeps single labels at
          32px but lets the border grow with the text where a narrow
          screen wraps a label onto a second line -- with a fixed height
          the box stayed at its 32px border while lines two and beyond
          spilled out of it. */
      .terminal-actions a,
      .terminal-actions button {
        box-sizing: border-box;
        line-height: 30px;
        min-height: 32px;
        padding: 0 20px;
        text-align: center;
      }
      /* iOS only: WebKit sizes the Source link's inline line box (label +
         baseline-standing svg) a touch taller than the button's, and --
         unlike every other engine -- will not stretch a flex-item
         <button> up to match. The row then shows two heights, with the
         link's content riding high in its taller box. The fix restores the
         fixed-height contract (bd67f3d) for iOS alone: pin BOTH controls
         to the shared 32px box, so their borders sit on the same line and
         both text baselines land at the same offset by construction (each
         content box is exactly the 30px line-height, centered in the
         32px border box). The link's content stays in PLAIN INLINE flow --
         the same construction every other platform already uses -- so the
         arrow keeps standing on the text baseline via vertical-align
         instead of being box-centered. ee0f3ff's flex overlay would
         re-center the svg against the line box (the arrow then hangs a few
         px below the baseline) and is dropped. Pinning the border boxes is
         safe here: "Source" and "Restart game" both fit one line down to
         ~270px of content width, below any iOS viewport, so the wrap-with-
         fixed-height bug (ace4b50's motivation) cannot trigger. @supports
         (-webkit-touch-callout: none) matches iOS only: desktop Safari,
         Android Chrome and Firefox do not implement it, so every other
         platform renders exactly as before. */
      @supports (-webkit-touch-callout: none) {
        .terminal-actions a,
        .terminal-actions button {
          height: 32px;
        }
        .terminal-actions a svg {
          height: 8px;
          width: 8px;
        }
      }
      button {
        --button-transition: 0.18s ease-out;
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        border: 1px solid rgba(200, 248, 200, 0.25);
        border-radius: 6px;
        color: rgba(200, 248, 200, 0.65);
        font: inherit;
        font-size: 14px;
        letter-spacing: 0.08em;
        outline: 0;
        padding: 7px 20px;
        text-transform: uppercase;
        transition:
          background-color var(--button-transition),
          border-color var(--button-transition),
          color var(--button-transition),
          text-shadow var(--button-transition);
      }
      @media (hover: hover) {
        button:hover,
        button:focus-visible {
          background: rgba(200, 248, 200, 0.04);
          border-color: rgba(200, 248, 200, 0.7);
          color: #c8f8c8;
          text-shadow: 0 0 5px rgba(200, 248, 200, 0.5);
        }
        .terminal-actions a:hover,
        .terminal-actions a:focus-visible {
          background: rgba(200, 248, 200, 0.04);
          border-color: rgba(200, 248, 200, 0.7);
          color: #c8f8c8;
          text-shadow: 0 0 5px rgba(200, 248, 200, 0.5);
        }
      }
      @media (hover: none) {
        button:active {
          background: rgba(200, 248, 200, 0.04);
          border-color: rgba(200, 248, 200, 0.7);
          color: #c8f8c8;
          transition-duration: 0s;
        }
        .terminal-actions a:active {
          background: rgba(200, 248, 200, 0.04);
          border-color: rgba(200, 248, 200, 0.7);
          color: #c8f8c8;
          transition-duration: 0s;
        }
      }
      #cursor {
        opacity: 1;
      }
      #cursor.blinking {
        animation: cursor-blink 1s steps(1) infinite;
      }
      @keyframes cursor-blink {
        50% {
          opacity: 0;
        }
      }
      /* Touch-only app shell: one branch for every touch-sized viewport.
         main is pinned to the viewport (it can no longer scroll): the
         keyboard inset is measured off main's rect, and an iOS page that
         scrolls would otherwise read its scroll offset as keyboard motion
         and resize the terminal under the finger. The insets are the
         padding main used to inherit from body, which no longer applies
         to an out-of-flow box. Scoped to hover:none (phones/tablets, not
         touch laptops, which keep the scrolling desktop layout).
         Below, only width may vary -- never height. A height query is
         re-evaluated against the very viewport the keyboard just shrank,
         so the old (max-height: 500px) block flipped true mid-open and
         moved main's top from 16px to 10px: the Android top-edge tick.
         Width, pointer and hover are the only inputs a soft keyboard
         cannot change, so nothing switches while it is opening.
         launcher.js mirrors the shell query (see usesFixedShell). */
      @media (pointer: coarse) and (hover: none) {
        body {
          /* Pull-to-refresh needs a scroll range, and browsers drop it on
             a page with nothing to scroll (keyboard-lab blue24): one pixel
             past svh -- imperceptible, and the gate and the launcher's
             scroll pin eat it northward. svh, not lvh: the page cannot
             scroll, so the toolbars never retract and the range stays
             exactly one pixel in every toolbar state. */
          min-height: calc(100svh + 1px);
        }
        main {
          --pad-x: 10px;
          /* Compact chrome. Every touch screen wider than a phone in
             portrait is the landscape / big-keyboard case, where height --
             not width -- is the scarce dimension. */
          --pad-y: 10px;
          position: fixed;
          top: var(--pad-y);
          right: var(--pad-x);
          left: var(--pad-x);
          /* Fixed window onto the transcript, scrolling internally: svh
             less the chrome and the keyboard inset launcher.js measures
             so the prompt rides above the keyboard. With resizes-content
             on Chrome the inset stays 0 and svh itself is the shrunk
             visible height; on iOS the measured inset does the work. */
          display: flex;
          flex-direction: column;
          height: calc(
            100svh - var(--pad-y) * 2 - var(--keyboard-inset, 0px)
          );
          /* Breathing room over the keyboard, none while it is closed. */
          padding-bottom: min(8px, var(--keyboard-inset, 0px));
        }
        #terminal-container {
          /* Fills the bounded main column. The floor keeps the transcript
             readable rather than collapsing it, and stays low enough that
             a short landscape screen plus keyboard does not overflow. */
          flex: 1 1 0;
          min-height: 120px;
        }
        #screen {
          /* blue29/30: here the transcript is NOT a native scroller. A
             non-scroller has no overscroll physics at all -- nothing to
             rubber-band, nothing to chain, no matter where a gesture
             starts (WebKit decides a gesture's overscroll up front, so
             overscroll-behavior could not cover a drag that ARRIVES at an
             edge mid-gesture). scrollTop still works programmatically:
             the touch driver in launcher.js is the only writer, and the
             ends are hard by construction. Desktop keeps the native
             scroller from the base rule above. */
          overflow: hidden;
        }
        #terminal-input {
          /* Stays pinned to the container's TOP edge like on desktop (the
             base rule): the caret is then always visible and WebKit runs
             no reveal pan on focus -- the root-cause fix for the whole
             page being dragged north when the keyboard opens (blue17's
             failure, blue24's fix). The echoed line in the transcript is
             the visible prompt; the field itself stays invisible. */
          opacity: 0;
        }
      }
      /* A phone in portrait has height to spare, so it gets the roomier
         chrome and the taller floor. Width is the discriminator because
         height is exactly what the keyboard takes away. */
      @media (pointer: coarse) and (hover: none) and (max-width: 560px) {
        main {
          --pad-y: 16px;
          padding-bottom: min(16px, var(--keyboard-inset, 0px));
        }
        #terminal-container {
          min-height: 160px;
        }
        #subtitle {
          font-size: 11px;
        }
        #screen {
          font-size: 14px;
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">The Oregon Trail (Fortran 77)</h1>
      <p id="subtitle">WebAssembly build using LFortran + Emscripten</p>
      <p id="status" hidden role="status" aria-atomic="true"></p>
      <div id="terminal-container">
        <h2 id="terminal-title" class="visually-hidden">Game terminal</h2>
        <p id="terminal-instructions" class="visually-hidden">
          Game output appears in this terminal. When the game asks a question,
          type your answer in the game command input and press Enter.
        </p>
        <div
          id="screen"
          role="region"
          aria-labelledby="terminal-title"
          aria-describedby="terminal-instructions"
          aria-live="off"
        >
          <pre
            id="terminal"
          ><span id="output">LOADING...</span><span id="input"></span><span id="cursor"></span></pre>
          <input
            id="terminal-input"
            type="text"
            enterkeyhint="enter"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            aria-label="Game command input"
            aria-describedby="terminal-instructions"
          />
        </div>
      </div>
      <div class="terminal-actions">
        <button id="restart-game" type="button">Restart game</button>
        <a
          id="github-link"
          href="https://github.com/minhqdao/oregon-fortran-wasm"
          target="_blank"
          rel="noopener noreferrer"
        >
          Source<svg
            aria-hidden="true"
            width="8"
            height="8"
            viewBox="0 0 8 8"
            focusable="false"
          >
            <path d="M0.5 7.5 L7 1 M7 1 H3 M7 1 V5" />
          </svg>
        </a>
      </div>
    </main>
    <script>
      // Boot-phase guard. index.html only paints a static "LOADING..." line;
      // every dynamic state is owned by launcher.js. Before it (or the worker
      // graph behind it) finishes loading, no launcher code exists to report
      // anything, so failures here would otherwise leave the terminal stuck
      // on LOADING... forever. Three independent nets:
      //
      // 1. Module instantiation failures (the classic post-deploy skew:
      //    "SyntaxError: Importing binding name 'x' is not found") fire the
      //    window error event with a message. One guarded recovery reload
      //    fixes the ordinary case -- a stale cached entry module mixing
      //    with fresh siblings -- because a reload revalidates the
      //    top-level document (browsers bypass its cache even though GH
      //    Pages caps HTML at the same fixed max-age=600 as every other
      //    file), and Pages deployments now ship the entry as one
      //    self-contained bundle whose bindings cannot skew. The
      //    sessionStorage guard mirrors the coi-serviceworker pattern: at
      //    most one recovery reload per session, never a loop.
      // 2. Module fetch failures (404/OMT/transient network) fire the same
      //    event with no message; those get the same single guarded reload
      //    (a transient blip usually clears on retry) and only then surface
      //    as text. Non-script resource errors (favicons, images) are
      //    ignored: they fire the identical capture-phase event but cannot
      //    fail the boot. Unhandled promise rejections (dynamic import()
      //    failures) are folded into the same path.
      // 3. A watchdog for everything that slips past (no error event, or a
      //    worker that dies before its first output): if the terminal still
      //    shows only the static LOADING... line after 20s, say so. The
      //    launcher owns #status once it runs, and disarms the watchdog by
      //    setting data-oregon-boot-done as soon as the game produces
      //    its first output, so the hint never fires for a healthy (if
      //    slow) startup.
      (function () {
        var status = document.getElementById("status");
        if (!status) return;
        var output = document.getElementById("output");
        var recoveryKey = "oregon-module-reload";

        function showBootStatus(message) {
          if (status.textContent) return;
          status.textContent = message;
          status.hidden = false;
        }

        function isBootDone() {
          return Boolean(document.documentElement.dataset.oregonBootDone);
        }

        // Only boot-entry scripts can fail the boot. Icons, images and
        // fonts fire the same capture-phase error event with no message;
        // treating those as fatal is the classic false-positive
        // ("favicon 404" -> "game failed to load").
        function isIgnorableResourceTarget(target) {
          if (!target || target === window) return false;
          var tag = (target.tagName || "").toUpperCase();
          return tag !== "SCRIPT";
        }

        // A skew-induced instantiation error -- or a transient fetch blip --
        // is usually recoverable by one reload; if it persists (this session
        // already retried), leave a visible diagnosis instead of looping.
        // sessionStorage can throw in some private modes; a failed read just
        // means "do not reload", which is the safe direction. Both boot-guard
        // branches share the one key, so the guard reloads at most once per
        // session in total. Returns true when a reload was issued.
        function tryRecoveryReload() {
          var retriedThisSession = false;
          try {
            retriedThisSession = Boolean(sessionStorage.getItem(recoveryKey));
          } catch {
            retriedThisSession = true;
          }
          if (retriedThisSession) return false;
          if (!/^https?:$/.test(window.location.protocol)) return false;
          try {
            sessionStorage.setItem(recoveryKey, "1");
          } catch {
            // Without storage the reload cannot be guarded; skip it.
            return false;
          }
          window.location.reload();
          return true;
        }

        function handleBootError(message, target) {
          if (isBootDone()) return;
          if (isIgnorableResourceTarget(target)) return;
          if (!message) {
            if (tryRecoveryReload()) return;
            showBootStatus(
              "The game failed to load. Reload the page to retry.",
            );
            return;
          }
          if (tryRecoveryReload()) return;
          showBootStatus(
            "Failed to load: " +
              message +
              " (a reload did not help; try a hard reload / clearing the site data)",
          );
        }

        window.addEventListener(
          "error",
          function (event) {
            // Module scripts report instantiation errors on window;
            // resource load errors carry the failed element instead.
            var target =
              event.target && event.target !== window
                ? event.target
                : window;
            handleBootError(event.message || "", target);
          },
          true,
        );

        window.addEventListener("unhandledrejection", function (event) {
          if (isBootDone()) return;
          var reason = event.reason;
          var message = "";
          if (typeof reason === "string") {
            message = reason;
          } else if (reason && typeof reason.message === "string") {
            message = reason.message;
          }
          try {
            event.preventDefault();
          } catch {
            // Some shims expose a read-only preventDefault; the guard's
            // own handling below is what matters.
          }
          handleBootError(message, window);
        });

        setTimeout(function () {
          if (document.documentElement.dataset.oregonBootDone) return;
          // Trim so the launcher's own "LOADING...\n" (no game output yet)
          // is still caught: a stall at this stage is the common case.
          if (output && output.textContent.trim() !== "LOADING...") return;
          showBootStatus(
            "Still loading after 20 seconds. Reload the page, or a hard reload if it persists.",
          );
        }, 20_000);
      })();
    </script>
    <script type="module" crossorigin src="./launcher.js"></script>
  </body>
</html>
