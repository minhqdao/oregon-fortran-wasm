<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="The Oregon Trail (1978) running in the browser as a Fortran-to-WebAssembly build, driven by a terminal-based game launcher."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0c0b" />
    <title>The Oregon Trail</title>
    <!--
      The launcher uses SharedArrayBuffer to stream keyboard input into a Web
      Worker that runs the WASM module, which requires cross-origin isolation.
      The coi-serviceworker.js (MIT, by Guido Zuidhof and contributors) registers
      a service worker that supplies the COOP/COEP response headers so this
      works from any static server (and file:// is not supported).
    -->
    <script>
      window.coi = { coepCredentialless: () => false };
    </script>
    <script src="./coi-serviceworker.js"></script>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        background: #0b0c0b;
      }
      ::selection {
        background: rgba(200, 248, 200, 0.24);
        color: #c8f8c8;
      }
      ::-moz-selection {
        background: rgba(200, 248, 200, 0.24);
        color: #c8f8c8;
      }
      body {
        color: #c8f8c8;
        font-family: "Courier New", Courier, monospace;
        font-size: 16px;
        margin: 0;
        min-height: 100vh;
        padding: 32px 16px;
      }
      main {
        margin: 0 auto;
        max-width: 800px;
      }
      .visually-hidden {
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }
      #status {
        color: #ffc47d;
        font-size: 13px;
        margin: 0 0 12px;
        min-height: 1em;
      }
      #terminal-container {
        background: #111512;
        border-radius: 12px;
        box-shadow:
          inset 0 0 30px rgba(255, 255, 255, 0.03),
          0 0 70px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.05);
        height: min(600px, calc(100vh - 150px));
        min-height: 360px;
        overflow: hidden;
        position: relative;
      }
      #terminal-container.keyboard-constrained {
        flex: none;
        height: var(--keyboard-terminal-height);
        min-height: 0;
      }
      #terminal-container::before {
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 2px,
          rgba(255, 255, 255, 0.025) 3px
        );
        content: "";
        inset: 0;
        pointer-events: none;
        position: absolute;
        z-index: 2;
      }
      #screen {
        color: #c8f8c8;
        font: inherit;
        height: 100%;
        line-height: 1.2;
        overflow-y: auto;
        padding: 28px;
        scrollbar-width: none;
        text-shadow: 0 0 2px rgba(200, 248, 200, 0.35);
      }
      #screen::-webkit-scrollbar {
        display: none;
      }
      #terminal {
        color: inherit;
        font: inherit;
        margin: 0;
        overflow-wrap: break-word;
        white-space: pre-wrap;
      }
      #terminal-input {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 1px;
        font-size: 16px;
        color: transparent;
        background: transparent;
        border: none;
        outline: none;
        caret-color: transparent;
        pointer-events: none;
        z-index: -1;
      }
      .terminal-actions {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
      }
      .terminal-actions a {
        align-items: center;
        display: inline-flex;
        -webkit-appearance: none;
        appearance: none;
        border: 1px solid rgba(200, 248, 200, 0.25);
        border-radius: 6px;
        color: rgba(200, 248, 200, 0.65);
        font-size: 14px;
        justify-content: center;
        letter-spacing: 0.08em;
        outline: 0;
        padding: 7px 20px;
        text-decoration: none;
        text-transform: uppercase;
        transition:
          background-color 0.18s ease-out,
          border-color 0.18s ease-out,
          color 0.18s ease-out,
          text-shadow 0.18s ease-out;
      }
      button {
        --button-transition: 0.18s ease-out;
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        border: 1px solid rgba(200, 248, 200, 0.25);
        border-radius: 6px;
        color: rgba(200, 248, 200, 0.65);
        font: inherit;
        font-size: 14px;
        letter-spacing: 0.08em;
        outline: 0;
        padding: 7px 20px;
        text-transform: uppercase;
        transition:
          background-color var(--button-transition),
          border-color var(--button-transition),
          color var(--button-transition),
          text-shadow var(--button-transition);
      }
      @media (hover: hover) {
        button:hover,
        button:focus-visible {
          background: rgba(200, 248, 200, 0.04);
          border-color: rgba(200, 248, 200, 0.7);
          color: #c8f8c8;
          text-shadow: 0 0 5px rgba(200, 248, 200, 0.5);
        }
        .terminal-actions a:hover,
        .terminal-actions a:focus-visible {
          background: rgba(200, 248, 200, 0.04);
          border-color: rgba(200, 248, 200, 0.7);
          color: #c8f8c8;
          text-shadow: 0 0 5px rgba(200, 248, 200, 0.5);
        }
      }
      @media (hover: none) {
        button:active {
          background: rgba(200, 248, 200, 0.04);
          border-color: rgba(200, 248, 200, 0.7);
          color: #c8f8c8;
          transition-duration: 0s;
        }
        .terminal-actions a:active {
          background: rgba(200, 248, 200, 0.04);
          border-color: rgba(200, 248, 200, 0.7);
          color: #c8f8c8;
          transition-duration: 0s;
        }
      }
      #cursor {
        opacity: 1;
      }
      #cursor.blinking {
        animation: cursor-blink 1s steps(1) infinite;
      }
      @keyframes cursor-blink {
        50% {
          opacity: 0;
        }
      }
      @media (max-width: 560px) {
        body {
          padding: 16px 10px;
        }
        main {
          display: flex;
          flex-direction: column;
          min-height: calc(100vh - 32px);
          min-height: calc(100dvh - 32px);
        }
        #terminal-container {
          flex: 1 1 auto;
          height: auto;
          min-height: 240px;
        }
        #screen {
          font-size: 14px;
          padding: 18px;
        }
        #terminal-input {
          display: block;
          opacity: 0;
          position: static;
          width: 100%;
          z-index: auto;
        }
      }
      @media (max-height: 500px) and (pointer: coarse) {
        body {
          padding: 10px;
        }
        main {
          display: flex;
          flex-direction: column;
          min-height: calc(100vh - 20px);
          min-height: calc(100dvh - 20px);
        }
        #terminal-container {
          flex: 1 1 auto;
          height: auto;
          min-height: 180px;
        }
        #terminal-input {
          display: block;
          opacity: 0;
          position: static;
          width: 100%;
          z-index: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">The Oregon Trail</h1>
      <p id="status" hidden role="status" aria-atomic="true"></p>
      <div id="terminal-container">
        <h2 id="terminal-title" class="visually-hidden">Game terminal</h2>
        <p id="terminal-instructions" class="visually-hidden">
          Game output appears in this terminal. When the game asks a question,
          type your answer in the game command input and press Enter.
        </p>
        <div
          id="screen"
          role="region"
          aria-labelledby="terminal-title"
          aria-describedby="terminal-instructions"
          aria-live="off"
        >
          <pre
            id="terminal"
          ><span id="output">LOADING...</span><span id="input"></span><span id="cursor"></span></pre>
          <input
            id="terminal-input"
            type="text"
            enterkeyhint="enter"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            aria-label="Game command input"
            aria-describedby="terminal-instructions"
          />
        </div>
      </div>
      <div class="terminal-actions">
        <a
          id="github-link"
          href="https://github.com/minhqdao/oregon-fortran-wasm"
          target="_blank"
          rel="noopener noreferrer"
        >
          Source
        </a>
        <button id="restart-game" type="button">Restart game</button>
      </div>
    </main>
    <script type="module" crossorigin src="./launcher.js"></script>
  </body>
</html>
