name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gfortran
          - lfortran
          - flang

    steps:
      - uses: actions/checkout@v7

      - name: Setup Fortran
        uses: minhqdao/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler }}

      - name: Build (gfortran)
        if: matrix.compiler == 'gfortran'
        run: gfortran src/oregon.f src/oregon_time.f -o oregon

      - name: Build (lfortran)
        if: matrix.compiler == 'lfortran'
        run: lfortran --fixed-form --implicit-interface --implicit-typing src/oregon.f src/oregon_time.f -o oregon

      - name: Build (flang)
        if: matrix.compiler == 'flang'
        run: flang src/oregon.f src/oregon_time.f -o oregon

      - name: Smoke test
        run: |
          printf "N\n3\n200\n100\n50\n50\n50\n2\n2\n2\n" | timeout 10 ./oregon | tee output.txt
          grep -q "HOW GOOD A SHOT" output.txt
          ! grep -q "INVALID" output.txt

      - name: Smoke test (STOP quits)
        run: |
          printf "STOP\n" | timeout 10 ./oregon | tee stop_output.txt
          ! grep -q "HOW GOOD A SHOT" stop_output.txt
          printf "N\nSTOP\n" | timeout 10 ./oregon | tee stop_mid_output.txt
          grep -q "HOW GOOD A SHOT" stop_mid_output.txt
          ! grep -q "INVALID" stop_mid_output.txt

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup LFortran
        uses: minhqdao/setup-fortran@v1
        with:
          compiler: lfortran

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build WebAssembly
        env:
          EMCC: ${{ env.EMSDK }}/upstream/emscripten/emcc
        run: scripts/build-web.sh

      - name: WASM smoke test
        run: |
          node scripts/headless-test.mjs web/oregon.js N 3 200 100 50 50 50 2 2 2 | tee output.txt
          grep -q "HOW GOOD A SHOT" output.txt
          ! grep -q "INVALID" output.txt

      - name: WASM smoke test (STOP quits)
        run: |
          node scripts/headless-test.mjs web/oregon.js STOP | tee stop_output.txt
          ! grep -q "HOW GOOD A SHOT" stop_output.txt
          node scripts/headless-test.mjs web/oregon.js N STOP | tee stop_mid_output.txt
          grep -q "HOW GOOD A SHOT" stop_mid_output.txt
          ! grep -q "INVALID" stop_mid_output.txt

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-build
          path: |
            web/oregon.js
            web/oregon.wasm
          if-no-files-found: error

  deploy-pages:
    needs: build-wasm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-build
          path: web

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
