name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gfortran
          - lfortran
          - flang

    steps:
      - uses: actions/checkout@v7

      - name: Setup Fortran
        uses: minhqdao/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler }}

      - name: Build (gfortran)
        if: matrix.compiler == 'gfortran'
        run: gfortran src/oregon.f src/oregon_time.f -o oregon

      - name: Build (lfortran)
        if: matrix.compiler == 'lfortran'
        run: lfortran --fixed-form --implicit-interface --implicit-typing src/oregon.f src/oregon_time.f -o oregon

      - name: Build (flang)
        if: matrix.compiler == 'flang'
        run: flang src/oregon.f src/oregon_time.f -o oregon

      - name: Smoke test
        run: |
          printf "N\n3\n200\n100\n50\n50\n50\n2\n2\n2\n" | timeout 10 ./oregon | tee output.txt
          grep -q "HOW GOOD A SHOT" output.txt
          ! grep -q "INVALID" output.txt

      - name: Smoke test (STOP quits)
        run: |
          printf "STOP\n" | timeout 10 ./oregon | tee stop_output.txt
          ! grep -q "HOW GOOD A SHOT" stop_output.txt
          printf "N\nSTOP\n" | timeout 10 ./oregon | tee stop_mid_output.txt
          grep -q "HOW GOOD A SHOT" stop_mid_output.txt
          ! grep -q "INVALID" stop_mid_output.txt

      - name: Regression suite (native)
        env:
          OREGON_NATIVE: ./oregon
        run: node scripts/run-tests.mjs --native-only

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Typecheck @ts-check sources (strict)
        run: scripts/typecheck.sh

      - name: Browser smoke tests (launcher gestures + boot guard)
        env:
          SMOKE_NODE_MODULES: ${{ github.workspace }}/scripts/node_modules
        run: |
          npm install --no-save --no-package-lock --prefix scripts jsdom@26
          node --test scripts/browser-smoke.test.mjs scripts/boot-guard.test.mjs

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup LFortran
        uses: minhqdao/setup-fortran@v1
        with:
          compiler: lfortran

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build WebAssembly
        env:
          EMCC: ${{ env.EMSDK }}/upstream/emscripten/emcc
        run: scripts/build-web.sh

      - name: WASM smoke test
        run: |
          node scripts/headless-test.mjs web/oregon.js N 3 200 100 50 50 50 2 2 2 | tee output.txt
          grep -q "HOW GOOD A SHOT" output.txt
          ! grep -q "INVALID" output.txt

      - name: WASM smoke test (STOP quits)
        run: |
          node scripts/headless-test.mjs web/oregon.js STOP | tee stop_output.txt
          ! grep -q "HOW GOOD A SHOT" stop_output.txt
          node scripts/headless-test.mjs web/oregon.js N STOP | tee stop_mid_output.txt
          grep -q "HOW GOOD A SHOT" stop_mid_output.txt
          ! grep -q "INVALID" stop_mid_output.txt

      - name: Install gfortran (native parity reference)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gfortran

      - name: WASM regression suite (with native parity)
        run: node scripts/run-tests.mjs

      - name: Verify deploy bundle
        run: |
          npm install --no-save --no-package-lock --prefix . esbuild@0.25.10
          ESBUILD=node_modules/.bin/esbuild scripts/bundle-web.sh --out dist
          node scripts/check-bundle.test.mjs dist

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-build
          path: |
            web/oregon.js
            web/oregon.wasm
          if-no-files-found: error

  deploy-pages:
    needs: build-wasm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-build
          path: web

      # GH Pages caches every file with a fixed max-age=600. Deploying the
      # modular web/ sources lets a reload mix a cached entry module with
      # fresh siblings, which kills the module graph ("Importing binding
      # name ... is not found") before the launcher can report anything.
      # bundle-web.sh collapses the graphs into single-file bundles with a
      # build-id query, so each page load is atomically one deploy.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bundle web deploy
        run: |
          npm install --no-save --no-package-lock --prefix . esbuild@0.25.10
          ESBUILD=node_modules/.bin/esbuild scripts/bundle-web.sh --out dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
